[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-xai-framework"
version = "1.0.0"
description = "Reproducible XAI framework used in the thesis replications"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.1.3", "pandas==2.2.3", "scikit-learn==1.6.1",
  "scipy==1.13.1", "matplotlib==3.10.1", "seaborn==0.13.2",
  "shap==0.51.0", "lime==0.2.0.1", "PyYAML==6.0.2",
  "joblib==1.4.2", "statsmodels==0.14.6"
]

[project.scripts]
xai-framework = "xai_framework.cli:main"
xai-compare = "xai_framework.compare_results:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["xai_framework*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: real SHAP/LIME smoke tests"]
